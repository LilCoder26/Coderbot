<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Code Encoder / Decoder</title>

  <!-- Google Font: Oswald -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Oswald', sans-serif;
      margin: 20px;
      background-color: #000;
      color: #acf034;
    }

    h1 {
      text-align: center;
      color: #acf034;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    textarea, input[type="number"], select {
      width: 100%;
      background-color: #111;
      color: #acf034;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 8px;
      font-family: 'Oswald', sans-serif;
    }

    textarea {
      height: 80px;
    }

    button {
      margin-top: 10px;
      background-color: #222;
      color: #acf034;
      border: 1px solid #444;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 10px;
      font-family: 'Oswald', sans-serif;
    }

    button:hover {
      background-color: #333;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
      white-space: pre-wrap;
      padding: 10px;
      background-color: #111;
      border: 1px solid #444;
      border-radius: 10px;
    }

    img {
      display: block;
      margin: 0 auto 20px auto;
      width: 200px;
    }

    /* Loading spinner */
    .loader {
      border: 4px solid #333;
      border-top: 4px solid #acf034;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <img src="Lil-Coder-5-4-2026.png" alt="Logo">

  <h1>Secret Code Encoder / Decoder</h1>

  <label for="mode">Mode:</label>
  <select id="mode">
    <option value="encode">Encode (normal → secret)</option>
    <option value="decode">Decode (secret → normal)</option>
  </select>

  <label for="shift">Shift (key):</label>
  <input type="number" id="shift" value="3">

  <label for="inputText">Input text:</label>
  <textarea id="inputText" placeholder="Type your message here..."></textarea>

  <button id="runBtn">Run</button>

  <div class="loader" id="loader"></div>

  <div class="result" id="output"></div>

  <script>
    function caesar(text, shift) {
      let result = "";
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (/[a-z]/i.test(char)) {
          const code = text.charCodeAt(i);
          const base = code >= 65 && code <= 90 ? 65 : 97;
          result += String.fromCharCode(((code - base + shift) % 26 + 26) % 26 + base);
        } else {
          result += char;
        }
      }
      return result;
    }

    document.getElementById("runBtn").addEventListener("click", () => {
      const loader = document.getElementById("loader");
      const output = document.getElementById("output");

      loader.style.display = "block";
      output.textContent = "";

      setTimeout(() => {
        const mode = document.getElementById("mode").value;
        const shiftValue = parseInt(document.getElementById("shift").value) || 0;
        const text = document.getElementById("inputText").value;

        const shift = mode === "decode" ? -shiftValue : shiftValue;
        const result = caesar(text, shift);

        loader.style.display = "none";
        output.textContent = result;
      }, 600);
    });
  </script>

</body>
</html>
